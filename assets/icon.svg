<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon, "the halo" (plans/visual-identity.md §8.2): the tower in gold on
     the Last light ground, inside the accent-violet ring of its light. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1e4c"/>
      <stop offset="0.34" stop-color="#1d2148"/>
      <stop offset="0.66" stop-color="#211d3f"/>
      <stop offset="1" stop-color="#3b2422"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b3a5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b3a5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <!-- The light: a violet ring (the accent, #b3a5ff), with a soft glow inside it. -->
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#b3a5ff" stroke-width="28"/>
  <!-- The tower: one gold silhouette (the gold of fx-gold), the arrow slit cut through. -->
  <g transform="translate(512 528) scale(0.74) translate(-512 -491)" fill="#f0b23c">
    <path fill-rule="evenodd" d="M512 210 L706 400 L676 400 L676 496 L652 496 L688 796 L712 796 L712 852 L312 852 L312 796 L336 796 L372 496 L348 496 L348 400 L318 400 Z
             M512 560 a30 30 0 0 1 30 30 v110 a30 30 0 0 1 -60 0 v-110 a30 30 0 0 1 30 -30 Z"/>
    <rect x="502" y="130" width="20" height="100"/>
    <path d="M522 140 L612 168 L522 196 Z"/>
  </g>
</svg>
