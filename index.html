<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Paired with --surface-0 in tokens.css: the ground the app sits on. -->
    <meta name="theme-color" content="#0a0d14" />
    <title>The Tower</title>
    <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <main id="stage" class="stage" data-screen="boot">
        <!-- No width/height: the camera owns the backing store (src/render/camera.ts). -->
        <canvas id="game-canvas" aria-label="Arena"></canvas>
        <div id="hud-root" class="hud-root"></div>
        <div id="screen-root" class="screen-root"></div>
        <div id="overlay-root" class="overlay-root"></div>
      </main>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
